<!DOCTYPE html>
<html>
<head>
    <title>Arunachal Pradesh District Data Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        #map {
            height: 100vh;
            width: 100%;
            background-color: #f0f0f0;
        }
        #info-display {
            position: absolute;
            top: 74px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid #ccc;
            min-width: 250px;
        }
        #info-display .hover-name {
            color: #333;
            margin-bottom: 10px;
        }
        #info-display .hover-data {
            font-size: 14px;
            font-weight: normal;
            color: #555;
        }
        #map-title {
            position: absolute;
            top: 20px;
            left: 60px;
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2px 15px;
            border-radius: 0px;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            color: #000080;
            z-index: 1000;
            pointer-events: none;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div id="info-display">
    <div class="hover-name">Click on a district</div>
    <div class="hover-data"></div>
</div>
<div id="map-title">Key District Data of Arunachal Pradesh</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {
        center: [28.0, 94.9],
        zoom: 8,
        layers: []
    });

    const infoDisplay = document.getElementById('info-display');
    const hoverNameDiv = infoDisplay.querySelector('.hover-name');
    const hoverDataDiv = infoDisplay.querySelector('.hover-data');

    const adminLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org">OpenStreetMap</a> contributors'
    });

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://www.esri.com/">Esri</a>, Source: Esri, Maxar, Earthstar Geographics'
    });

    adminLayer.addTo(map);

    const baseLayers = {
        "Administrative": adminLayer,
        "Satellite": satelliteLayer
    };

    L.control.layers(baseLayers).addTo(map);

    let currentBaseLayer = adminLayer;
    let geoJsonLayer;
    let districtData = {};

    map.on('baselayerchange', function(e) {
        currentBaseLayer = e.layer;
        updateGeoJsonStyle();
    });

    fetch('/static/data/district_data.json')
        .then(response => response.ok ? response.json() : {})
        .then(data => { districtData = data; })
        .catch(error => {
            hoverNameDiv.textContent = 'Error loading district data!';
            hoverDataDiv.textContent = '';
        });

    fetch('/static/geojson/arunachal_district_boundary.geojson')
        .then(response => response.json())
        .then(data => {
            geoJsonLayer = L.geoJSON(data, {
                style: getCurrentStyle(),
                onEachFeature: function (feature, layer) {
                    layer.on({
                        mouseover: function (e) {
                            e.target.setStyle({
                                weight: 3,
                                color: currentBaseLayer === satelliteLayer ? '#ffff00' : '#000',
                                dashArray: '',
                                fillOpacity: 0.1
                            });
                            if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                                e.target.bringToFront();
                            }
                            if (feature.properties && feature.properties.name) {
                                hoverNameDiv.textContent = feature.properties.name;
                                hoverDataDiv.textContent = 'Click for details.';
                            }
                        },
                        mouseout: function (e) {
                            geoJsonLayer.resetStyle(e.target);
                            const isDisplayShowingClickedResult =
                                hoverDataDiv.textContent !== '' &&
                                hoverDataDiv.textContent !== 'Click for details.';
                            if (!isDisplayShowingClickedResult) {
                                hoverNameDiv.textContent = 'Click on a district';
                                hoverDataDiv.textContent = '';
                            }
                        },
                        click: function (e) {
                            const districtName = feature.properties?.name;
                            if (districtName) {
                                hoverNameDiv.textContent = districtName;
                                const dataForDistrict = districtData[districtName];
                                if (dataForDistrict && Object.keys(dataForDistrict).length > 0) {
                                    let dataHtml = '';
                                    for (const key in dataForDistrict) {
                                        const formattedKey = key.replace(/_/g, ' ');
                                        dataHtml += `<strong>${formattedKey}:</strong> ${dataForDistrict[key]}<br>`;
                                    }
                                    hoverDataDiv.innerHTML = dataHtml;
                                } else {
                                    hoverDataDiv.textContent = 'Data not available.';
                                }
                            } else {
                                hoverNameDiv.textContent = 'District (Name N/A)';
                                hoverDataDiv.textContent = 'No data available or Dist_Name missing in GeoJSON.';
                            }
                        }
                    });
                }
            }).addTo(map);
        });

    function getCurrentStyle() {
        return {
            color: currentBaseLayer === satelliteLayer ? 'yellow' : 'darkred',
            weight: 1,
            fillOpacity: 0.1
        };
    }

    function updateGeoJsonStyle() {
        if (geoJsonLayer) {
            geoJsonLayer.setStyle(getCurrentStyle());
        }
    }

    map.on('click', function() {
        const isDistrictDataDisplayedFromClick =
            hoverDataDiv.textContent !== '' && hoverDataDiv.textContent !== 'Click for details.';
        if (!isDistrictDataDisplayedFromClick) {
            hoverNameDiv.textContent = 'Click on a district';
            hoverDataDiv.textContent = '';
        }
    });
</script>
</body>
</html>
