<!DOCTYPE html>
<html>
<head>
    <title>Arunachal Pradesh District Data Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Optional: Add some basic styling for the map container */
        #map {
            height: 100vh; /* Make the map take full viewport height */
            width: 100%;
            background-color: #f0f0f0; /* Add a background color since there's no tile layer */
        }

        /* Style for the state name and data display */
        #info-display {
            position: absolute;
            top: 10px;
            right: 10px; /* Changed to right as per your previous design */
            background-color: rgba(255, 255, 255, 0.8);
            padding: 8px 12px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            z-index: 1000; /* Ensure it's above the map */
            pointer-events: none; /* Allows mouse events to pass through to the map */
            border: 1px solid #ccc;
            min-width: 250px; /* Give it some space */
        }
        #info-display .hover-name { /* Generic class for name */
            color: #333;
            margin-bottom: 10px;
        }
        #info-display .hover-data { /* Generic class for data */
            font-size: 14px;
            font-weight: normal;
            color: #555;
        }

        /* Style for the new map title */
        #map-title {
            position: absolute;
            top: 20px;
            left: 60px; /* Positioned on the left */
            background-color: rgba(255, 255, 255, 0.8);
            padding: 2px 15px;
            border-radius: 0px;
            font-family: Arial, sans-serif;
            font-size: 24px; /* Bigger font size */
            font-weight: bold;
            color: #000080; /* Deep blue color */
            z-index: 1000; /* Ensure it's above the map */
            pointer-events: none; /* Allows mouse events to pass through */
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="info-display">
        <div class="hover-name">Click on a district</div>
        <div class="hover-data"></div>
    </div>

    <div id="map-title">Key District Data of Arunachal Pradesh</div> <!-- New title element added here -->

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const arunachalBounds = L.latLngBounds(
            L.latLng(26.5, 91.4),
            L.latLng(29.5, 97.5)
        );

        const map = L.map('map', {
            maxBounds: arunachalBounds.pad(0.05),
            maxBoundsViscosity: 1.0,
            minZoom: 8,
            maxZoom: 18
        }).setView([28.0, 94.9], 8);
        const infoDisplay = document.getElementById('info-display');
        const hoverNameDiv = infoDisplay.querySelector('.hover-name');
        const hoverDataDiv = infoDisplay.querySelector('.hover-data');

        const mapLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org">OpenStreetMap</a> contributors'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri, Maxar, Earthstar Geographics'
        });

        mapLayer.addTo(map);

        L.control.layers(
            { "Map": mapLayer, "Satellite": satelliteLayer },
            null,
            { position: 'bottomright' }
        ).addTo(map);

        let currentBase = mapLayer;
        let districtLayer = null;

        function isSatellite() { return currentBase === satelliteLayer; }

        function getDistrictStyle() {
            return {
                color: isSatellite() ? 'white' : 'darkred',
                weight: 1,
                fillOpacity: 0.1
            };
        }

        map.on('baselayerchange', function(e) {
            currentBase = e.layer;
            if (districtLayer) districtLayer.setStyle(getDistrictStyle());
        });

        let districtData = {};

        // Fetch external district data (e.g., population, schools) from district_data.json
        // This data will be linked to districts by their 'district' property.

        fetch('/static/data/district_data.json')
            .then(response => {
                if (!response.ok) {
                    // Log a warning if the data file is not found, but don't stop execution.
                    console.warn("Failed to load external district data. Make sure 'district_data.json' exists in '/static/data/'.");
                    return {}; // Return an empty object if the file is not found, to prevent errors later.
                }
                return response.json();
            })
            .then(data => {
                districtData = data; // Store the fetched data
                console.log("External district data loaded:", districtData);
            })
            .catch(error => {
                console.error("Error loading external district data:", error);
                // Update the info display if there's a critical error loading data.
                hoverNameDiv.textContent = 'Error loading district data!';
                hoverDataDiv.textContent = '';
            });

        // Load Arunachal Pradesh Districts GeoJSON
        // This layer defines the geographical boundaries of the districts.
        fetch('/static/geojson/arunachal_district_boundary.geojson')
            .then(response => {
                if (!response.ok) {
                    // Throw an error if the GeoJSON file itself cannot be loaded.
                    throw new Error("Failed to load Arunachal Pradesh districts GeoJSON file: " + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                // Build a mask that covers the world except Arunachal Pradesh
                const worldOuter = [[-90, -180], [-90, 180], [90, 180], [90, -180], [-90, -180]];
                const holes = [];
                data.features.forEach(function(feature) {
                    const geom = feature.geometry;
                    const coords = geom.type === 'MultiPolygon' ? geom.coordinates : [geom.coordinates];
                    coords.forEach(function(polygon) {
                        holes.push(polygon[0].map(function(c) { return [c[1], c[0]]; }));
                    });
                });
                const maskLayer = L.polygon([worldOuter].concat(holes), {
                    color: 'none',
                    fillColor: '#f0f0f0',
                    fillOpacity: 1,
                    interactive: false
                }).addTo(map);

                districtLayer = L.geoJSON(data, {
                    style: getDistrictStyle,
                    // Function to be called for each feature (district) in the GeoJSON
                    onEachFeature: function (feature, layer) {
                        layer.on({
                            // Event for mouse hovering over a district (for highlighting)
                            mouseover: function (e) {
                                var layer = e.target;
                                layer.setStyle({
                                    weight: 3,
                                    color: isSatellite() ? '#ffff00' : '#000',
                                    dashArray: '',
                                    fillOpacity: 0.1
                                });
                                // Bring the hovered layer to the front to prevent overlap issues
                                if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                                    layer.bringToFront();
                                }
                                // Display only the district name on hover, not detailed data
                                if (feature.properties && feature.properties.name) {
                                    hoverNameDiv.textContent = feature.properties.name;
                                    hoverDataDiv.textContent = 'Click for details.'; // Prompt user to click
                                } else {
                                     hoverNameDiv.textContent = 'District (Name N/A)';
                                     hoverDataDiv.textContent = 'Click for details.';
                                }
                            },
                            // Event for mouse leaving a district (to reset highlighting)
                            mouseout: function (e) {
                                districtLayer.resetStyle(e.target);

                                // Check if the current display is showing data or a "no data" message from a previous CLICK.
                                // This ensures these messages persist on mouseout.
                                const isDisplayShowingClickedResult = hoverDataDiv.textContent !== '' && hoverDataDiv.textContent !== 'Click for details.';

                                // If the display is *not* currently showing a clicked result (data or "no data" message),
                                // then reset the display for general hover.
                                if (!isDisplayShowingClickedResult) {
                                    hoverNameDiv.textContent = 'Click on a district';
                                    hoverDataDiv.textContent = '';
                                }
                            },
                            // Event for mouse clicking on a district (to display data)
                            click: function (e) {
                                // Optional: Zoom to the clicked district (uncomment if desired)
                                // map.fitBounds(e.target.getBounds());

                                // Display district name and associated data
                                if (feature.properties && feature.properties.name) {
                                    const districtName = feature.properties.name;
                                    hoverNameDiv.textContent = districtName; // Display the district name

                                    // Look up the associated data in the 'districtData' object
                                    const dataForDistrict = districtData[districtName];
                                    if (dataForDistrict && Object.keys(dataForDistrict).length > 0) { // Ensure data exists and is not empty
                                        let dataHtml = '';
                                        // Loop through the data properties and format them for display
                                        for (const key in dataForDistrict) {
                                            const formattedKey = key.replace(/_/g, ' '); // Replace underscores for better readability
                                            dataHtml += `<strong>${formattedKey}:</strong> ${dataForDistrict[key]}<br>`;
                                        }
                                        hoverDataDiv.innerHTML = dataHtml; // Display the formatted data
                                    } else {
                                        // Appropriate message if no data found for the clicked district
                                        hoverDataDiv.textContent = 'Data not available.';
                                    }
                                } else {
                                    // Fallback if 'Dist_Name' property is missing from GeoJSON feature
                                    hoverNameDiv.textContent = 'District (Name N/A)';
                                    hoverDataDiv.textContent = 'No data available or Dist_Name missing in GeoJSON.';
                                }
                            }
                        });
                    }
                }).addTo(map);
                districtLayer.bringToFront();
            })
            .catch(error => {
                console.error("Error loading Arunachal Pradesh districts GeoJSON:", error);
                // Update the info display to show the error if GeoJSON fails to load.
                infoDisplay.innerHTML = '<div class="hover-name" style="color: red;">Error: Failed to load district map data.</div>';
            });

            // Add a general map click listener to clear the info-display
            // This ensures the display clears if the user clicks on the map background
            // and no district is actively selected to show data.
            map.on('click', function() {
                // Determine if a district's data (or no-data message) is currently displayed from a click.
                // This will be true if data was shown OR "No detailed data available" message was shown.
                const isDistrictDataDisplayedFromClick = hoverDataDiv.textContent !== '' && hoverDataDiv.textContent !== 'Click for details.';

                // If no district data (or no-data message) is actively displayed, or if it's an error state,
                // then reset the display to default.
                if (!isDistrictDataDisplayedFromClick) {
                    hoverNameDiv.textContent = 'Click on a district';
                    hoverDataDiv.textContent = '';
                }
            });
    </script>
</body>
</html>
